<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>مكتب الأستاذ محمود القرقاري المحامي</title>
<style>
:root{--navy:#0f172a;--sky:#0284c7;--amb:#fbbf24;--mu:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:14px/1.6 Cairo,Tahoma,Arial,sans-serif;background:#f1f5f9;color:#1e293b;overscroll-behavior-y:none}
.hid{display:none!important}
button{font:inherit;cursor:pointer;border:0}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 4px 16px #0f172a0f}
.inp{width:100%;font:inherit;font-size:13px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;outline:0;color:#1e293b}
.inp:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 2px #0284c726}
textarea.inp{min-height:90px;resize:vertical}
.btn{width:100%;border-radius:12px;font-weight:700;padding:11px;font-size:13px;margin-top:8px;transition:.15s}
.btn:active{transform:scale(.97)}
.b-sky{background:var(--sky);color:#fff}.b-amb{background:var(--amb);color:#0f172a}.b-gr{background:#f1f5f9;color:#1e293b}.b-red{background:#fee2e2;color:#b91c1c}
/* قفل */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#070e17,#0d1a2d 50%,#07101d)}
#lock .in{width:100%;max-width:340px;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;background:#f59e0b1a;border:1px solid #f59e0b4d;display:flex;align-items:center;justify-content:center;font-size:28px}
#lock h1{color:var(--amb);font-size:18px;font-weight:800;margin:0 0 4px}
#lock p{color:#cbd5e1;font-size:12px;margin:0 0 4px}
#pin{text-align:center;font-size:20px;font-weight:700;letter-spacing:.4em;background:#ffffff1a;color:#fff;border:1px solid #fff3;border-radius:16px;padding:12px;margin-top:22px}
#perr{color:#fb7185;font-size:12px;font-weight:700;margin-top:10px}
.dev{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 10px;border-radius:99px;font-size:11px;direction:ltr}
.dev i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.dev b{color:#f59e0b}
.dk{background:#ffffff0d;border:1px solid #fbbf2440;color:#94a3b8}.lt{background:#fff;border:1px solid var(--bd);color:var(--mu)}
/* رأس */
.cover{position:relative;height:176px;overflow:hidden;background:#020617;color:#fff}
.cover img{width:100%;height:100%;object-fit:cover;opacity:.55}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#020617,#020617a0 55%,transparent)}
.cv{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;max-width:540px;margin:auto}
.pill{font-size:11px;font-weight:600;background:#0f172acc;border:1px solid #33415599;border-radius:99px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;color:#cbd5e1}
.pill s{width:8px;height:8px;border-radius:50%;background:#94a3b8}.pill s.on{background:#34d399}
.cv h1{margin:0;font-size:18px;font-weight:900;color:var(--amb)}.cv p{margin:2px 0 0;font-size:12px;font-weight:700}
main{max-width:540px;margin:auto;padding:14px 14px calc(100px + env(safe-area-inset-bottom,0px))}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.st div{background:#fff;border:1px solid var(--bd);border-radius:14px;text-align:center;padding:8px 4px;font-size:11px;color:var(--mu)}.st b{display:block;font-size:20px;color:var(--navy)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--bd);color:var(--mu)}.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.it{display:flex;gap:10px;padding:11px;margin-bottom:10px}
.dt{flex:none;width:50px;text-align:center;border-left:1px solid var(--bd);padding-left:10px}.dt b{display:block;font-size:22px;line-height:1.1;color:var(--navy)}.dt span{font-size:11px;color:var(--mu)}
.dt.late b{color:#e11d48}.dt.today b{color:#d97706}
.it .bd{flex:1;min-width:0}.r1{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}.r1 b{font-size:14px}
.mu{color:var(--mu);font-size:12px}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;background:#fef3c7;color:#92400e}.badge.d{background:#dcfce7;color:#166534}.badge.j{background:#e0e7ff;color:#3730a3}
.nn{font-size:11px;font-weight:700;color:var(--sky)}
.grp{font-weight:800;font-size:12px;color:var(--mu);margin:14px 2px 8px}.grp.l{color:#e11d48}.grp.t{color:#d97706}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}.empty h2{color:#1e293b;margin:0 0 6px;font-size:16px}
/* شريط سفلي */
.tb{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:516px;margin:auto;height:64px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:60;background:#ffffffe0;-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid #fffc;border-radius:24px;box-shadow:0 10px 30px #0f172a1f}
.tb .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--mu);background:none;position:relative}.tb .t i{font-style:normal;font-size:17px}.tb .t.on{color:var(--sky)}
.tb .t em{position:absolute;top:-6px;right:50%;margin-right:-24px;background:#e11d48;color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px}
.ctr{position:relative;top:-14px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;font-size:20px;border:2px solid #fff;box-shadow:0 8px 20px #0284c759}
.fab{position:fixed;left:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--sky);color:#fff;font-size:24px;border:2px solid #fff;box-shadow:0 6px 16px #0284c755;z-index:40}
/* نوافذ */
.sheet{position:fixed;inset:0;background:#0f172a8c;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:110;display:none;align-items:flex-end;justify-content:center;padding:0 10px calc(20px + env(safe-area-inset-bottom,0px))}.sheet.on{display:flex}
.si{background:#fff;width:100%;max-width:540px;border-radius:24px;padding:18px;max-height:88dvh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.si h2{margin:0 0 4px;font-size:16px;font-weight:800}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px;font-weight:600}
#det{position:fixed;inset:0;z-index:50;background:#f1f5f9;overflow-y:auto}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--navy);color:#fff}
.dh button{width:34px;height:34px;border-radius:12px;background:#ffffff1a;color:#fff;font-size:16px}.dh h2{margin:0;font-size:15px}
.dm{max-width:540px;margin:auto;padding:14px 14px 40px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;padding:12px;font-size:13px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word}
.sec{font-weight:800;font-size:13px;margin:16px 2px 8px}
.tl{position:relative;padding-right:16px}.tl:before{content:"";position:absolute;right:4px;top:6px;bottom:6px;width:2px;background:#cbd5e1}
.ti{position:relative;padding-bottom:12px;font-size:13px}.ti:before{content:"";position:absolute;right:-16px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--sky);border:2px solid #fff;box-shadow:0 0 0 2px var(--sky)}
.nt{padding:10px 12px;margin-bottom:8px;white-space:pre-wrap;font-size:13px;border-right:4px solid var(--amb)}
.nt .m{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:6px;white-space:normal}.nt .m button{background:none;color:#e11d48;font-size:12px;font-weight:700}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin:auto;width:max-content;max-width:90%;background:#0f172a;color:#fff;border-radius:12px;padding:9px 16px;font-size:13px;z-index:200;display:none}
</style>
</head>
<body>
<div id="lock">
  <form class="in" onsubmit="unlock(event)">
    <div class="logo">⚖️</div>
    <h1>مكتب الأستاذ محمود القرقاري</h1>
    <p style="font-weight:600">المحامي</p>
    <p style="color:#94a3b8;font-size:11px">تطبيق متابعة المكتب</p>
    <input id="pin" class="inp" type="password" inputmode="numeric" placeholder="أدخل كلمة المرور" autocomplete="off">
    <button class="btn b-amb" style="padding:14px">دخول النظام</button>
    <div id="perr" class="hid">كلمة المرور غير صحيحة</div>
    <div style="margin-top:28px;padding-top:18px;border-top:1px solid #1e293b"><span class="dev dk"><i>⌨</i>Developer <b>Mohamed Hassan</b></span></div>
  </form>
</div>

<div id="app" class="hid">
  <div class="cover">
    <img src="IMG-20261012-WA0000.jpg" alt="" onerror="this.style.display='none'">
    <div class="cv">
      <div><span class="pill"><s id="dot"></s><span id="sync">لم يُرفع ملف بعد</span></span></div>
      <div><h1>⚖️ الأستاذ محمود القرقاري المحامي</h1><p>متابعة المكتب — عرض وملاحظات فقط</p></div>
    </div>
  </div>
  <main id="main"></main>
  <button class="fab" id="fab" onclick="noteForm(null,'note')">+</button>
  <nav class="tb">
    <button class="t" data-t="cases" onclick="go('cases')"><i>📂</i>القضايا</button>
    <button class="t" data-t="sessions" onclick="go('sessions')"><i>📅</i>الجلسات</button>
    <button class="ctr" onclick="openSh('files')">⇅</button>
    <button class="t" data-t="notes" onclick="go('notes')"><i>📝</i>ملاحظاتي<em id="nb"></em></button>
    <button class="t" data-t="settings" onclick="go('settings')"><i>⚙️</i>الإعدادات</button>
  </nav>
</div>

<div id="det" class="hid"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSh()"><div class="si" id="si"></div></div>
<div id="toast"></div>
<input type="file" id="f" accept=".json,application/json" hidden onchange="loadFile(this)">

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB=null,NOTES=[],tab='cases',flt='all',cur=null,mode='note';
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* تخزين محلي: نسخة من ملف السيستم (عرض فقط) + الملاحظات */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('office_followup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kvGet=async k=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}};
const kvSet=async(k,v)=>{try{const d=await idb();return await new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(1);t.onerror=()=>ok(0)})}catch(e){return 0}};
const saveNotes=()=>kvSet('notes',NOTES);

/* أدوات */
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const dFmt=s=>{try{return new Date(s+'T00:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
const tFmt=t=>{try{return new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}catch(e){return''}};
const val=v=>Array.isArray(v)?v.map(val).filter(Boolean).join('، '):(v&&typeof v==='object')?(v.t||v.name||v.title||v.text||Object.values(v).filter(x=>typeof x!=='object').join(' ')):(v==null?'':v);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const clientOf=c=>(DB.clients||[]).find(x=>String(x.id)===String(c.clientId));

/* قفل */
function unlock(e){e.preventDefault();if($('pin').value===(ls.g('ff_pin')||'1234')){$('lock').classList.add('hid');$('app').classList.remove('hid');$('perr').classList.add('hid')}else{$('perr').classList.remove('hid');$('pin').value=''}}

/* رفع ملف السيستم (قراءة فقط) */
function loadFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{try{
    const p=JSON.parse(rd.result);
    if(!p||typeof p!=='object'||Array.isArray(p)||!Array.isArray(p.cases))throw 0;
    DB={clients:p.clients||[],cases:p.cases||[],tribal:p.tribal||[],cx:p.cx||{},lawyer:String(p.lawyer||(p._meta&&p._meta.lawyer)||'').trim(),at:Date.now()};
    await kvSet('db',DB);closeSh();render();toast('تم رفع الملف: '+DB.cases.length+' قضية');
  }catch(e){toast('الملف غير صالح — ارفع database.json من السيستم')}};
  rd.readAsText(f,'UTF-8');inp.value='';
}

/* العناصر */
function items(){
  const a=[];
  (DB.cases||[]).forEach(c=>{const cl=clientOf(c);a.push({k:'case',id:c.id,o:c,title:'قضية '+(c.number||''),client:cl?cl.name:'',sub:[c.opponent&&('ضد '+c.opponent),c.subject].filter(Boolean).join(' — '),court:c.court||'',date:c.nextDate||'',status:c.status||''})});
  (DB.tribal||[]).forEach(t=>a.push({k:'tribal',id:t.id,o:t,title:t.title||'جلسة عرفية',client:t.parties||'',sub:t.location||'',court:'',date:t.nextDate||'',status:t.status||''}));
  return a;
}
const find=(k,id)=>items().find(i=>i.k===k&&String(i.id)===String(id));
const notesOf=(k,id)=>NOTES.filter(n=>n.refType===k&&String(n.refId)===String(id));
const done=i=>i.status==='منتهية';
const bcls=s=>s==='منتهية'?'d':/جنح|احكام|أحكام/.test(s)?'j':'';

function card(i){
  const n=notesOf(i.k,i.id).length,d=i.date?diff(i.date):null,cls=d==null?'':d<0?'late':d===0?'today':'',day=i.date?new Date(i.date+'T00:00:00'):null;
  return `<div class="card it" data-k="${i.k}" data-id="${esc(i.id)}" onclick="openItem(this.dataset.k,this.dataset.id)">
  <div class="dt ${cls}">${day?`<b>${day.getDate()}</b><span>${day.toLocaleDateString('ar-EG',{month:'short'})}</span>`:'<b>—</b>'}</div>
  <div class="bd"><div class="r1"><b>${esc(i.title)}</b><span class="badge ${bcls(i.status)}">${esc(i.status||'—')}</span></div>
  ${i.client?`<div class="mu">👤 ${esc(i.client)}</div>`:''}${i.sub?`<div class="mu">${esc(i.sub)}</div>`:''}${i.court?`<div class="mu">🏛 ${esc(i.court)}</div>`:''}
  ${n?`<span class="nn">📝 ${n} ملاحظة</span>`:''}</div></div>`;
}

/* الشاشات */
const EMPTY='<div class="empty"><div style="font-size:42px">📂</div><h2>ارفع ملف السيستم</h2><p>اختر ملف database.json من السيستم. التطبيق للعرض فقط ولا يغيّر أي بيانات، وأي تعديل تكتبه يتحول لملاحظة.</p><button class="btn b-sky" onclick="$(\'f\').click()">رفع الملف</button></div>';
function vCases(){
  const all=items().filter(i=>i.k==='case'),n=s=>all.filter(i=>i.status===s).length;
  return `<input id="q" class="inp" placeholder="استعلام: رقم قضية / موكل / خصم / محكمة / موضوع" oninput="fillCases()">
  <div class="st"><div><b>${all.length}</b>إجمالي</div><div><b>${n('قيد النظر')}</b>قيد النظر</div><div><b>${n('منتهية')}</b>منتهية</div></div>
  <div class="chips">${[['all','الكل'],['قيد النظر','قيد النظر'],['جنح صدر بعدها احكام','صدر أحكام'],['منتهية','منتهية']].map(c=>`<button class="${flt===c[0]?'on':''}" onclick="flt='${c[0]}';render()">${c[1]}</button>`).join('')}</div><div id="cl"></div>`;
}
function fillCases(){
  const q=($('q').value||'').trim().toLowerCase();
  const L=items().filter(i=>i.k==='case'&&(flt==='all'||i.status===flt)&&(!q||(i.title+' '+i.client+' '+i.sub+' '+i.court).toLowerCase().includes(q)));
  $('cl').innerHTML=L.length?L.map(card).join(''):'<div class="empty">لا توجد نتائج.</div>';
}
function vSessions(){
  const L=items().filter(i=>i.date&&!done(i)).sort((a,b)=>a.date.localeCompare(b.date));
  if(!L.length)return '<div class="empty">لا توجد جلسات قادمة في الملف.</div>';
  return [['l','متأخرة',d=>d<0],['t','اليوم',d=>d===0],['','غدًا',d=>d===1],['','خلال أسبوع',d=>d>1&&d<=7],['','لاحقًا',d=>d>7]].map(g=>{const r=L.filter(i=>g[2](diff(i.date)));return r.length?`<div class="grp ${g[0]}">${g[1]} (${r.length})</div>`+r.map(card).join(''):''}).join('');
}
function noteHTML(n,t){return `<div class="card nt">${n.kind==='edit'?'<b>تعديل مقترح — </b>':''}${t?`<b>${esc(n.title)}</b>\n`:''}${esc(n.text)}<div class="m"><span>${esc(tFmt(n.ts))}</span><button onclick="delNote('${esc(n.id)}')">حذف</button></div></div>`}
function vNotes(){
  if(!NOTES.length)return '<div class="empty"><div style="font-size:42px">📝</div><h2>لا توجد ملاحظات</h2><p>افتح أي قضية واضغط «إضافة ملاحظة» أو «اقتراح تعديل».</p></div>';
  return `<button class="btn b-amb" style="margin:0 0 12px" onclick="exportNotes()">تحميل ملف الملاحظات (${NOTES.length})</button>`+NOTES.slice().sort((a,b)=>b.ts-a.ts).map(n=>noteHTML(n,1)).join('');
}
function vSettings(){
  return `<div class="card" style="padding:16px"><b>🔑 كلمة مرور الدخول</b><form onsubmit="chPin(event)">
  <input id="p0" class="inp" type="password" inputmode="numeric" placeholder="الحالية" style="margin-top:10px"><input id="p1" class="inp" type="password" inputmode="numeric" placeholder="الجديدة (4 أرقام فأكثر)" style="margin-top:8px"><button class="btn b-sky">حفظ كلمة المرور</button></form></div>
  <div class="card" style="padding:16px;margin-top:12px"><b>🗄 البيانات المخزنة بالجهاز</b><div class="mu" style="margin-top:6px;line-height:1.9">${DB?`قضايا: ${DB.cases.length}<br>موكلون: ${DB.clients.length}<br>جلسات عرفية: ${DB.tribal.length}<br>آخر رفع: ${esc(tFmt(DB.at))}${DB.lawyer?'<br>المحامي: '+esc(DB.lawyer):''}`:'لم يُرفع ملف بعد'}<br>ملاحظاتي: ${NOTES.length}</div></div>
  <div class="card" style="padding:16px;margin-top:12px"><b>📁 الملفات</b><p class="mu">التطبيق للعرض فقط. ارفع database.json، وحمّل ملف الملاحظات وأضفه في السيستم من «ملاحظات التطبيق ← رفع ملف الملاحظات».</p>
  <button class="btn b-gr" onclick="$('f').click()">رفع ملف (database.json)</button><button class="btn b-gr" onclick="exportNotes()">تحميل ملف الملاحظات</button></div>
  <div style="text-align:center;padding:16px 0"><span class="dev lt"><i style="color:#fff">⌨</i>Developer <b>Mohamed Hassan</b></span></div>`;
}
function chPin(e){e.preventDefault();if($('p0').value!==(ls.g('ff_pin')||'1234')){toast('كلمة المرور الحالية غير صحيحة');return}const n=$('p1').value;if(n.length<4){toast('الجديدة 4 أرقام على الأقل');return}ls.s('ff_pin',n);toast('تم تغيير كلمة المرور');e.target.reset()}

function render(){
  $('sync').textContent=DB?`${DB.cases.length} قضية • رُفع ${tFmt(DB.at)}`:'لم يُرفع ملف بعد';$('dot').className=DB?'on':'';
  $('nb').textContent=NOTES.length;$('nb').style.display=NOTES.length?'':'none';
  document.querySelectorAll('.tb .t').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('fab').style.display=tab==='notes'||tab==='settings'?'none':'';
  $('main').innerHTML=tab==='settings'?vSettings():tab==='notes'?vNotes():!DB?EMPTY:tab==='sessions'?vSessions():vCases();
  if(DB&&tab==='cases')fillCases();
}
function go(t){tab=t;render();scrollTo(0,0)}

/* نوافذ */
function openSh(w){
  if(w==='files')$('si').innerHTML=`<h2>الملفات</h2><div class="mu">رفع ملف السيستم أو تحميل ملف الملاحظات</div><button class="btn b-sky" onclick="closeSh();$('f').click()">⬆ رفع ملف (database.json)</button><button class="btn b-amb" onclick="closeSh();exportNotes()">⬇ تحميل ملف الملاحظات (${NOTES.length})</button><button class="btn b-gr" onclick="closeSh()">إغلاق</button>`;
  $('sheet').classList.add('on');
}
function closeSh(){$('sheet').classList.remove('on')}

/* تفاصيل قضية (عرض فقط) */
function openItem(k,id){
  const i=find(k,id);if(!i)return;cur=i;const o=i.o,x=(DB.cx&&DB.cx[o.id])||{};
  const rows=k==='case'?[['الموكل',i.client+(o.clientDesc?' ('+o.clientDesc+')':'')],['الهاتف',(clientOf(o)||{}).phone],['الخصم',(o.opponent||'')+(o.opponentDesc?' ('+o.opponentDesc+')':'')],['الموضوع',o.subject],['المحكمة',o.court],['الدائرة',o.circuit],['درجة المحكمة',x.degree],['الجلسة القادمة',o.nextDate?dFmt(o.nextDate):''],['آخر قرار',o.lastDecision],['الحالة',o.status],['ملاحظات',o.notes],['الشهود',val(x.wits)],['الخصوم',val(x.opps)],['التجهيزات',val(x.prep)],['ملاحظة التجهيز',x.prepNote]]
    :[['الأطراف',o.parties],['المكان',o.location],['الجلسة القادمة',o.nextDate?dFmt(o.nextDate):''],['آخر قرار',o.lastDecision],['الحالة',o.status]];
  const h=(o.history||[]).slice().reverse(),nn=notesOf(k,id);
  $('det').innerHTML=`<div class="dh"><button onclick="closeDet()">➜</button><h2>${esc(i.title)}</h2></div><div class="dm">
  <div class="mu" style="margin-bottom:8px">عرض فقط — لا يتم تغيير أي بيانات</div>
  <dl class="card kv" style="margin:0">${rows.filter(r=>val(r[1])!=='').map(r=>`<dt>${r[0]}</dt><dd>${esc(val(r[1]))}</dd>`).join('')}</dl>
  ${h.length?`<div class="sec">سجل الجلسات</div><div class="card" style="padding:14px"><div class="tl">${h.map(x=>`<div class="ti"><b>${esc(x.date?dFmt(x.date):'')}</b><br>${esc(x.decision||'')}${x.postponedTo?'<br><span class="mu">أُجلت إلى '+esc(dFmt(x.postponedTo))+'</span>':''}</div>`).join('')}</div></div>`:''}
  <div class="sec">ملاحظاتي على هذه القضية (${nn.length})</div>${nn.map(n=>noteHTML(n,0)).join('')}
  <button class="btn b-sky" onclick="noteForm(cur,'note')">إضافة ملاحظة</button><button class="btn b-amb" onclick="noteForm(cur,'edit')">اقتراح تعديل</button></div>`;
  $('det').classList.remove('hid');$('det').scrollTop=0;
}
function closeDet(){$('det').classList.add('hid');cur=null;render()}

/* نموذج الملاحظة / اقتراح التعديل */
const FIELDS={case:[['nextDate','تاريخ الجلسة القادمة','date'],['lastDecision','قرار آخر جلسة'],['status','حالة القضية'],['court','المحكمة'],['circuit','الدائرة'],['other','بيان آخر']],tribal:[['nextDate','تاريخ الجلسة القادمة','date'],['lastDecision','قرار آخر جلسة'],['status','الحالة'],['location','المكان'],['other','بيان آخر']]};
function noteForm(it,m){
  cur=it;mode=m;const F=it?FIELDS[it.k]:null;
  $('si').innerHTML=`<h2>${m==='edit'?'اقتراح تعديل':'ملاحظة جديدة'}</h2><div class="mu">${it?esc(it.title):'ملاحظة عامة'} — تُحفظ كملاحظة فقط</div>
  ${m==='edit'&&F?`<label>ما الذي تريد تعديله؟</label><select id="nf" class="inp" onchange="fldChg()">${F.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('')}</select><label>القيمة الحالية</label><div class="inp" id="nold" style="background:#f1f5f9"></div><label>القيمة المقترحة</label><div id="nnew"></div><label>سبب التعديل (اختياري)</label>`:'<label>الملاحظة</label>'}
  <textarea id="nt" class="inp" placeholder="${m==='edit'?'اكتب السبب أو أي توضيح':'اكتب ملاحظتك هنا'}"></textarea>
  <button class="btn b-sky" onclick="saveNote()">حفظ الملاحظة</button><button class="btn b-gr" onclick="closeSh()">إلغاء</button>`;
  $('sheet').classList.add('on');if(m==='edit'&&F)fldChg();
}
function fldChg(){const f=FIELDS[cur.k].find(x=>x[0]===$('nf').value),old=cur.o[f[0]];$('nold').textContent=old?(f[2]==='date'?dFmt(old):old):'—';$('nnew').innerHTML=`<input id="nv" class="inp" type="${f[2]||'text'}">`}
function saveNote(){
  let text=$('nt').value.trim(),kind='note',field='';
  if(mode==='edit'&&cur){
    const F=FIELDS[cur.k].find(x=>x[0]===$('nf').value),nv=$('nv').value.trim();
    if(!nv){toast('اكتب القيمة المقترحة');return}
    const old=cur.o[F[0]];field=F[1];kind='edit';
    text=`تعديل مقترح على «${F[1]}»\nالحالي: ${old||'—'}\nالمقترح: ${nv}`+(text?`\nالسبب: ${text}`:'');
  }else if(!text){toast('اكتب الملاحظة أولًا');return}
  const lw=(DB&&DB.lawyer)||'';
  NOTES.unshift({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:cur?cur.title:'ملاحظة عامة',text,ts:Date.now(),read:false,refType:cur?cur.k:'',refId:cur?cur.o.id:'',client:cur?cur.client:'',court:cur?cur.court:'',by:lw||'التطبيق',lawyer:lw,kind,field});
  saveNotes();closeSh();toast('تم حفظ الملاحظة');
  if(cur)openItem(cur.k,cur.o.id);else render();
}
function delNote(id){
  if(!confirm('حذف الملاحظة؟'))return;
  NOTES=NOTES.filter(n=>String(n.id)!==String(id));saveNotes();
  if(!$('det').classList.contains('hid')&&cur)openItem(cur.k,cur.id);else render();
}

/* تحميل ملف الملاحظات (يُرفع في السيستم: ملاحظات التطبيق ← رفع ملف الملاحظات) */
async function exportNotes(){
  if(!NOTES.length){toast('لا توجد ملاحظات لتحميلها');return}
  const lw=(DB&&DB.lawyer)||'';
  const text=JSON.stringify({vnotes:NOTES,vnotesDel:[],lawyer:lw,_meta:{t:Date.now(),app:'office-followup',notesOnly:true,lawyer:lw}},null,2),name='app-notes.json';
  const CP=window.Capacitor&&Capacitor.Plugins;
  if(CP&&CP.Filesystem&&CP.Share){
    try{const r=await CP.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});await CP.Share.share({title:'ملاحظات التطبيق',url:r.uri,dialogTitle:'حفظ أو إرسال ملف الملاحظات'});return}
    catch(e){if(e&&/cancel/i.test(String(e.message||e)))return}
  }
  const blob=new Blob([text],{type:'application/json'});
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'ملف ملاحظات',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(blob);await w.close();toast('تم حفظ ملف الملاحظات');return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('تم تحميل ملف الملاحظات');
}

/* بدء التشغيل */
(async()=>{
  const n=await kvGet('notes');if(Array.isArray(n))NOTES=n;
  const d=await kvGet('db');if(d&&Array.isArray(d.cases))DB=d;
  render();
})();
</script>
