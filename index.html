<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>مكتب الأستاذ محمود القرقاري المحامي</title>
<meta name="theme-color" content="#0f172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#0284c7;--navy:#0f172a}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:#f1f5f9;color:#1e293b;overscroll-behavior-y:none;font-size:14px}
.hidden{display:none!important}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.card.tap:active{background:#f8fafc}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:#64748b;font-size:12px;margin-top:3px;line-height:1.8}
.btn{border:0;border-radius:12px;font:inherit;font-weight:700;padding:11px 14px;cursor:pointer;transition:.15s;color:#fff;background:var(--sky)}
.btn:active{transform:scale(.97)}
.btn.sl{background:#f1f5f9;color:#1e293b}.btn.em{background:#059669}.btn.am{background:#f59e0b;color:#0f172a}.btn.vi{background:#7c3aed}
.btn.rd{background:transparent;border:1px solid #e11d48;color:#e11d48;padding:3px 10px;font-size:11px;font-weight:600}
.btn.w{width:100%}
.inp{width:100%;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font:inherit;font-size:13px;outline:none;transition:.2s}
.inp:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 2px rgba(2,132,199,.15)}
textarea.inp{resize:vertical}
.badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-prog{background:#fef3c7;color:#92400e}.b-done{background:#dcfce7;color:#166534}.b-junh{background:#e0e7ff;color:#3730a3}.b-late{background:#ffe4e6;color:#9f1239}.b-gray{background:#f1f5f9;color:#475569}
.hero{background:linear-gradient(135deg,#070e17 0%,#0d1a2d 55%,#0c2a44 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 28px 28px}
.hero .in{max-width:540px;margin:auto}
.chipw{font-size:11px;font-weight:600;background:rgba(15,23,42,.8);padding:4px 10px;border-radius:999px;border:1px solid rgba(100,116,139,.5);display:inline-flex;align-items:center;gap:6px;color:#cbd5e1;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;flex:none}.dot.o{background:#fbbf24}
.hb{width:34px;height:34px;border-radius:12px;background:rgba(30,41,59,.85);border:0;color:#cbd5e1;display:flex;align-items:center;justify-content:center;font-size:15px}
.hero h1{margin:14px 0 0;font-size:18px;font-weight:900;color:#fbbf24;display:flex;align-items:center;gap:6px}
.hero p{margin:2px 0 0;font-size:12px;font-weight:700}
.lwb{display:inline-block;margin-top:8px;background:#fbbf24;color:#0f172a;font-size:12px;font-weight:800;border-radius:999px;padding:2px 12px}
main{max-width:540px;margin:auto;padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
.tab-bar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:516px;margin:0 auto;height:64px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:space-around;border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.12);padding:0 6px;z-index:999;transition:transform .3s,opacity .3s}
.tab-bar.hide{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;font-weight:700;color:#64748b;background:transparent;border:0;cursor:pointer;position:relative}
.tabbtn.on{color:var(--sky)}.tabbtn svg{font-size:18px}.tabbtn.on svg{transform:scale(1.15)}
.tabbtn .bd{position:absolute;top:-4px;right:50%;margin-right:-24px;background:#e11d48;color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.center{position:relative;top:-14px;width:52px;height:52px;background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(2,132,199,.35);border:2px solid #fff;cursor:pointer;font-size:20px}
.center:active{transform:scale(.94)}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:1100;display:none;align-items:flex-end;justify-content:center;padding:0 10px calc(30px + env(safe-area-inset-bottom))}
.sheet.on{display:flex}
.sheet-inner{background:#fff;width:100%;max-width:540px;border-radius:24px;padding:18px 18px 22px;max-height:calc(100dvh - 90px);overflow-y:auto;box-shadow:0 -8px 30px rgba(15,23,42,.15);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:800}
.fl{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:10px}
.fl .inp{margin-top:4px;font-weight:400}
#detail{position:fixed;inset:0;z-index:50;background:#f1f5f9;overflow-y:auto}
#detail .wrap{max-width:540px;margin:auto;min-height:100%}
.dh{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0f172a;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.dh .hb{background:rgba(255,255,255,.1)}
.dh h2{margin:0;font-size:14px;font-weight:900;color:#fbbf24;flex:1}
#d-body{padding:14px 14px 140px}
#d-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:516px;margin:auto;background:rgba(255,255,255,.96);border:1px solid #e2e8f0;border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;gap:8px;z-index:60}
.h2{font-size:13px;font-weight:800;color:#0369a1;margin:16px 2px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
.kv:last-child{border:0}.kv span:first-child{color:#64748b;white-space:nowrap}.kv span:last-child{text-align:left;word-break:break-word;white-space:pre-wrap;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:9px 4px;text-align:center;cursor:pointer;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--sky)}.stat span{font-size:11px;color:#64748b;font-weight:700}
.stat.on{border-color:var(--sky);background:#f0f9ff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:6px 13px;background:#fff;border:1px solid #e2e8f0;color:#64748b;white-space:nowrap;cursor:pointer}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{text-align:right;border:1px solid #e2e8f0;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(15,23,42,.06);font:inherit;cursor:pointer}
.tool .row{margin-bottom:6px}.tool svg{font-size:20px}.tool b{font-size:12.5px;font-weight:800;color:#1e293b}
.note{border-right:4px solid #f59e0b}.note.edit{border-right-color:#2563eb}.note.decision{border-right-color:#059669}.note.payment{border-right-color:#7c3aed}
.note .t{white-space:pre-wrap;line-height:1.9;font-size:13px;margin-top:6px}
.tl{position:relative;padding-right:14px}.tl:before{content:'';position:absolute;right:4px;top:6px;bottom:6px;width:2px;background:#cbd5e1}
.tli{position:relative;padding-bottom:12px;font-size:13px}.tli:before{content:'';position:absolute;right:-14px;top:5px;width:10px;height:10px;border-radius:50%;background:#0284c7;border:2px solid #fff;box-shadow:0 0 0 2px #0284c7}
.empty{text-align:center;color:#94a3b8;padding:30px 10px;line-height:2;font-weight:600}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border:1px solid #fbbf24;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:2000;max-width:90%;text-align:center}
.dev{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;font-size:11px;direction:ltr}
.dev .ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.dev .nm{font-weight:800;background:linear-gradient(90deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.dev.dk{background:rgba(255,255,255,.05);border:1px solid rgba(251,191,36,.25);color:#94a3b8}
.dev.lt{background:#fff;border:1px solid #e2e8f0;color:#64748b}
.dev.lt .nm{background:linear-gradient(90deg,#0369a1,#0284c7);-webkit-background-clip:text;background-clip:text}
#lock{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#070e17 0%,#0d1a2d 50%,#07101d 100%)}
#lock .box{width:100%;max-width:360px;text-align:center;color:#fff}
#lock .lg{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);display:flex;align-items:center;justify-content:center;color:#fbbf24;font-size:28px}
#pin{width:100%;text-align:center;font:inherit;font-size:20px;font-weight:700;letter-spacing:.4em;border-radius:18px;padding:12px 16px;outline:none;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);margin-bottom:14px}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="lg" id="lock-ic"></div>
    <h1 style="color:#fbbf24;font-weight:800;font-size:18px;margin:0 0 4px">مكتب الأستاذ محمود القرقاري</h1>
    <p style="color:#cbd5e1;font-size:12px;font-weight:700;margin:0 0 4px">المحامي بالنقض والإدارية العليا</p>
    <p style="color:#94a3b8;font-size:11px;margin:0 0 24px">تطبيق متابعة القضايا</p>
    <form id="lockf">
      <input id="pin" type="password" inputmode="numeric" placeholder="أدخل كلمة المرور" autocomplete="off">
      <button class="btn w" style="background:#fbbf24;color:#0f172a;padding:14px" type="submit">دخول</button>
      <p id="pin-err" class="hidden" style="color:#fb7185;font-size:12px;font-weight:700;margin:10px 0 0">كلمة المرور غير صحيحة</p>
    </form>
    <div style="margin-top:30px;padding-top:18px;border-top:1px solid #1e293b;display:flex;justify-content:center"><div class="dev dk"><span class="ic" data-i="code"></span><span>Developed by</span><span class="nm">Mohamed Hassan</span></div></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="hero"><div class="in">
    <div class="row">
      <span class="chipw"><span class="dot o" id="sdot"></span><span id="stxt">لم يُرفع ملف</span></span>
      <div style="display:flex;gap:6px"><button class="hb" data-a="tab" data-id="settings" data-i="gear"></button><button class="hb" data-a="reload" data-i="refresh"></button></div>
    </div>
    <h1><span data-i="scale"></span> الأستاذ محمود القرقاري المحامي</h1>
    <p>بالنقض والإدارية العليا</p>
    <div id="lw"></div>
  </div></div>

  <main>
    <section id="tab-cases"></section>
    <section id="tab-clients" class="hidden"></section>
    <section id="tab-tribal" class="hidden"></section>
    <section id="tab-more" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>

  <nav class="tab-bar">
    <button class="tabbtn on" data-tab="cases" data-a="tab" data-id="cases"><span data-i="scale"></span><span>القضايا</span></button>
    <button class="tabbtn" data-tab="clients" data-a="tab" data-id="clients"><span data-i="users"></span><span>الموكلين</span></button>
    <button class="center" data-a="center"><span data-i="swap"></span></button>
    <button class="tabbtn" data-tab="tribal" data-a="tab" data-id="tribal"><span data-i="cal"></span><span>العرفية</span></button>
    <button class="tabbtn" data-tab="more" data-a="tab" data-id="more"><span data-i="grid"></span><span>المزيد</span><b class="bd hidden" id="nbd"></b></button>
  </nav>
</div>

<div id="detail" class="hidden"><div class="wrap">
  <div class="dh"><button class="hb" data-a="back" data-i="back"></button><h2 id="d-title"></h2></div>
  <div id="d-body"></div>
</div><div id="d-bar" class="hidden"></div></div>

<div id="sheet" class="sheet"><div class="sheet-inner" id="sheetin"></div></div>
<input type="file" id="file" style="display:none">

<script>
"use strict";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var P={scale:'M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7zM8 21h8',users:'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',cal:'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',swap:'M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1',refresh:'M21 12a9 9 0 1 1-3-6.7M21 3v6h-6',back:'M5 12h14M13 6l6 6-6 6',pen:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',note:'M4 4h16v12l-4 4H4zM16 20v-4h4M8 9h8M8 13h5',coin:'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',up:'M12 16V4M6 10l6-6 6 6M4 20h16',down:'M12 4v12M6 10l6 6 6-6M4 20h16',share:'M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13',x:'M18 6 6 18M6 6l12 12',plus:'M12 5v14M5 12h14',code:'M3 5h18v11H3zM2 20h20M10 8 8 10l2 2M14 8l2 2-2 2',gavel:'M14 13l-8.5 8.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8',phone:'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z'};
function ic(n){return '<svg class="i" viewBox="0 0 24 24"><path d="'+(P[n]||'')+'"/></svg>'}
function paintIcons(){document.querySelectorAll('[data-i]').forEach(function(e){if(!e.dataset.p){e.insertAdjacentHTML('afterbegin',ic(e.dataset.i));e.dataset.p=1}})}

var S={db:null,meta:{},notes:[],del:[],tab:'cases',stack:[],q:'',st:'all',nf:'all',ready:{}};
var LISTS=['clients','cases','tribal','payments','archive','team','exp','invoices','installments','poa','emergency','requests','courts','officeExp','laws','vnotes'];

/* ---------- التخزين ---------- */
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('office-followup',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function kvGet(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}).catch(function(){return null})}
function kvSet(k,v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})}).catch(function(){toast('تعذر الحفظ على الجهاز')})}
function saveNotes(){return kvSet('notes',{notes:S.notes,del:S.del})}
function saveDb(){return kvSet('db',{db:S.db,meta:S.meta})}

/* ---------- أدوات ---------- */
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return ds(d)}
function dAr(d){if(!d)return '—';try{var x=new Date(String(d).slice(0,10)+'T00:00:00');if(isNaN(x))return String(d);return x.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return String(d)}}
function money(n){return (Number(n)||0).toLocaleString('ar-EG')+' ج.م'}
function sum(a){return a.reduce(function(s,x){return s+(Number(x)||0)},0)}
function nid(){return 'app-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lawyer(){return (S.meta&&S.meta.lawyer)||''}
function D(){return S.db}
function clientOf(c){return (D().clients||[]).find(function(x){return x.id==c.clientId})||{}}
function caseOf(id){return (D().cases||[]).find(function(x){return x.id==id})}
function kv(l,v){if(v==null||v==='')return '';return '<div class="kv"><span>'+esc(l)+'</span><span>'+v+'</span></div>'}
function sec(t,b){return b?'<div class="h2">'+esc(t)+'</div><div class="card">'+b+'</div>':''}
function norm(p){LISTS.forEach(function(k){if(!Array.isArray(p[k]))p[k]=[]});if(!p.cx||typeof p.cx!=='object'||Array.isArray(p.cx))p.cx={};return p}
function stBadge(s){s=s||'قيد النظر';var c=/منته|حكم|محسوم/.test(s)?'b-done':/قيد|متداول|جاري/.test(s)?'b-prog':'b-junh';return '<span class="badge '+c+'">'+esc(s)+'</span>'}

/* ---------- رفع الملف (لا يُعدَّل أي شيء فيه) ---------- */
function onFile(f){
  if(!f)return;
  f.text().then(function(t){
    var p;try{p=JSON.parse(t.replace(/^\uFEFF/,''))}catch(e){alert('الملف مش سليم — اختار ملف database.json');return}
    if(!p||typeof p!=='object'||Array.isArray(p)||!(Array.isArray(p.cases)||Array.isArray(p.clients)||Array.isArray(p.tribal))){alert('ده مش ملف بيانات السيستم.');return}
    var lw=String(p.lawyer||(p._meta&&p._meta.lawyer)||'').trim();
    S.db=norm(p);S.meta={file:f.name,at:Date.now(),lawyer:lw,caseOnly:!!(p._meta&&p._meta.caseOnly)};
    S.stack=[];S.tab='cases';S.q='';S.st='all';S.ready={};closeSheet();
    saveDb();render();
    toast('تم رفع الملف — '+S.db.cases.length+' قضية'+(lw?' • المحامي: '+lw:''));
  });
}

/* ---------- الملاحظات ---------- */
function addNote(o){
  var n={id:nid(),title:o.title,text:o.text,ts:Date.now(),by:lawyer()||'التطبيق',read:false,kind:o.kind||'note',refType:o.refType||'general',refId:o.refId,client:o.client||'',court:o.court||''};
  if(lawyer())n.lawyer=lawyer();
  if(o.changes)n.changes=o.changes;
  S.notes.unshift(n);saveNotes();closeSheet();render();toast('اتسجّلت في الملاحظات');
}
function delNote(id){

  var docs=x.docs||[];
  h+=sec('المستندات ('+docs.length+')',docs.map(function(d){return kv(esc(d.cat||'مستند'),esc(d.name)+(d.date?' — '+esc(d.date):''))}).join('')+(docs.length?'<div class="sub">الملفات نفسها موجودة على السيستم.</div>':''));
  h+=sec('المالية',kv('الأتعاب',money(c.fee))+kv('المدفوع',money(paid))+kv('المتبقي',money((Number(c.fee)||0)-paid))+pays.map(function(p){return kv('دفعة '+esc(p.date||''),money(p.amount)+(p.notes?' — '+esc(p.notes):''))}).join('')+ins.map(function(g){return (g.list||[]).map(function(i){return kv('قسط '+esc(i.date||''),money(i.amount)+(i.paid?' ✓ مدفوع':' — غير مدفوع'))}).join('')}).join('')+exps.map(function(e){return kv('مصروف '+esc(e.date||''),esc(e.type||'')+' — '+money(e.amount)+(e.note?' ('+esc(e.note)+')':''))}).join('')+inv.map(function(v){return kv('فاتورة '+esc(v.no||''),money(sum((v.items||[]).map(function(i){return i.q*i.p}))-(Number(v.disc)||0))+(v.cancelled?' (ملغاة)':''))}).join(''));
  var ns=S.notes.filter(function(n){return n.refType==='case'&&n.refId==c.id}).map(function(n){return noteCard(n)}),fn=(D().vnotes||[]).filter(function(n){return n.refType==='case'&&n.refId==c.id}).map(function(n){return noteCard(n,true)});
  h+='<div class="h2">الملاحظات على القضية ('+(ns.length+fn.length)+')</div>'+(ns.concat(fn).join('')||'<div class="empty">مفيش ملاحظات</div>');
  return h;
}
function clientBody(c){
  var cs=(D().cases||[]).filter(function(x){return x.clientId==c.id}),po=(D().poa||[]).filter(function(p){return p.clientId==c.id});
  var h=sec('بيانات الموكل',kv('الاسم',esc(c.name))+kv('الهاتف',c.phone?'<a href="tel:'+esc(c.phone)+'" style="color:#0284c7;text-decoration:none">'+esc(c.phone)+'</a>':'')+kv('الرقم القومي',esc(c.nationalId))+kv('التوكيل',esc(c.powerOfAttorney)));
  h+=sec('التوكيلات',po.map(function(p){return kv(esc(p.type||'توكيل')+' '+esc(p.number||''),esc(p.status||'')+(p.expiry?' — ينتهي '+esc(p.expiry):''))}).join(''));
  h+='<div class="h2">القضايا ('+cs.length+')</div>'+(cs.map(caseCard).join('')||'<div class="empty">مفيش قضايا</div>');
  var ns=S.notes.filter(function(n){return n.refType==='client'&&n.refId==c.id}).map(function(n){return noteCard(n)});
  if(ns.length)h+='<div class="h2">الملاحظات</div>'+ns.join('');
  return h;
}
function notesBody(){
  var l=S.notes.filter(function(n){return S.nf==='all'||n.kind===S.nf});
  var h='<div class="grid2" style="margin-bottom:10px"><button class="btn" data-a="dl">'+ic('down')+' تحميل الملف</button><button class="btn em" data-a="share">'+ic('share')+' مشاركة الملف</button></div><button class="btn sl w" style="margin-bottom:6px" data-a="nt" data-t="general" data-id="">'+ic('plus')+' ملاحظة عامة</button>';
  h+='<div class="chips" style="margin-bottom:10px">'+[['all','الكل'],['edit','تعديلات'],['decision','قرارات'],['payment','دفعات'],['note','ملاحظات']].map(function(f){return '<span class="chip'+(S.nf===f[0]?' on':'')+'" data-a="nf" data-id="'+f[0]+'">'+f[1]+'</span>'}).join('')+'</div>';
  return h+(l.length?l.map(function(n){return noteCard(n)}).join(''):'<div class="empty">مفيش ملاحظات لسه.<br>أي تعديل بتعمله في التطبيق هيتسجّل هنا.</div>');
}
function renderDetail(top){
  var t='',b='',bar='';
  if(top.t==='case'){var c=caseOf(top.id);if(c){t='قضية رقم '+c.number;b=caseBody(c);
    bar='<button class="btn" style="flex:1" data-a="dec" data-id="'+esc(c.id)+'">'+ic('gavel')+' تسجيل ما حدث بالجلسة</button><button class="btn em" data-a="nt" data-t="case" data-id="'+esc(c.id)+'" title="ملاحظة">'+ic('note')+'</button><button class="btn sl" data-a="edc" data-id="'+esc(c.id)+'" title="تعديل">'+ic('pen')+'</button><button class="btn am" data-a="pay" data-id="'+esc(c.id)+'" title="دفعة">'+ic('coin')+'</button>'}else b='<div class="empty">القضية مش موجودة</div>'}
  else if(top.t==='client'){var k=(D().clients||[]).find(function(x){return x.id==top.id});if(k){t=k.name;b=clientBody(k);
    bar='<button class="btn" style="flex:1" data-a="edcl" data-id="'+esc(k.id)+'">'+ic('pen')+' تعديل البيانات</button><button class="btn em" style="flex:1" data-a="nt" data-t="client" data-id="'+esc(k.id)+'">'+ic('note')+' ملاحظة</button>'}else b='<div class="empty">الموكل مش موجود</div>'}
  else if(top.id==='notes'){t='ملاحظاتي';b=notesBody()}
  else{var m=MORE[top.id],a=(D()||{})[top.id]||[];t=m[0]+' ('+a.length+')';b=a.length?a.map(m[3]).join(''):'<div class="empty">مفيش بيانات</div>'}
  $('#d-title').textContent=t;$('#d-body').innerHTML=b;$('#d-bar').innerHTML=bar;$('#d-bar').classList.toggle('hidden',!bar);
}

var EMPTY='<div class="card" style="text-align:center;padding:26px 16px"><b style="font-size:16px">ارفع ملف البيانات</b><p style="color:#64748b;line-height:2;font-size:13px">اختار ملف <b>database.json</b> اللي جالك من المكتب (من «إرسال قضية لمحامي» أو نسخة السيستم الكاملة).<br>التطبيق بيعرض البيانات بس — أي تعديل بتعمله بيتسجّل <b>ملاحظة</b> ومبيغيّرش حاجة في السيستم.</p><button class="btn w" data-a="upload">'+ic('up')+' رفع الملف</button></div>';
var TABS=['cases','clients','tribal','more','settings'];
function render(){
  var top=S.stack[S.stack.length-1];
  $('#detail').classList.toggle('hidden',!top);$('.tab-bar').classList.toggle('hide',!!top);
  document.body.style.overflow=top?'hidden':'';
  $('#sdot').className='dot'+(S.db?'':' o');$('#stxt').textContent=S.db?(S.meta.file||'تم رفع الملف'):'لم يُرفع ملف';
  $('#lw').innerHTML=lawyer()?'<span class="lwb">المحامي: '+esc(lawyer())+'</span>':'';
  var nb=$('#nbd');nb.textContent=S.notes.length;nb.classList.toggle('hidden',!S.notes.length);
  TABS.forEach(function(t){$('#tab-'+t).classList.toggle('hidden',S.tab!==t)});
  document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.toggle('on',b.dataset.tab===S.tab)});
  if(top){renderDetail(top);return}
  var T=S.tab;
  if(T==='settings'){$('#tab-settings').innerHTML=settingsTab();return}
  if(T==='more'){$('#tab-more').innerHTML=moreTab();return}
  if(!S.db){$('#tab-'+T).innerHTML=EMPTY;S.ready={};return}
  if(T==='cases'){if(!S.ready.cases)shellCases();fillCases()}
  else if(T==='clients'){if(!S.ready.clients)shellClients();fillClients()}
  else if(T==='tribal'){var tr=D().tribal||[];$('#tab-tribal').innerHTML=tr.length?tr.map(tribalCard).join(''):'<div class="empty">مفيش جلسات عرفية</div>'}
}
function go(t,id){S.stack.push({t:t,id:id});history.pushState({n:S.stack.length},'');render();var d=$('#detail');d.scrollTop=0}

/* ---------- الأحداث ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,id=el.dataset.id;
  if(a==='upload'){closeSheet();$('#file').value='';$('#file').click()}
  else if(a==='dl')exportNotes(false);
  else if(a==='share')exportNotes(true);
  else if(a==='back')history.back();
  else if(a==='reload')location.reload();
  else if(a==='center')centerSheet();
  else if(a==='tab'){S.stack=[];S.tab=id;S.q='';if(id==='cases'||id==='clients')S.ready={};render();scrollTo(0,0)}
  else if(a==='case'||a==='client')go(a,id);
  else if(a==='view')go('view',id);
  else if(a==='st'){S.st=id;render()}
  else if(a==='nf'){S.nf=id;render()}
  else if(a==='edc')editCase(id);
  else if(a==='dec')decideCase(id,'case');
  else if(a==='tdec')decideCase(id,'tribal');
  else if(a==='pay')payCase(id);
  else if(a==='edcl')editClient(id);
  else if(a==='nt')noteCase(el.dataset.t,id);
  else if(a==='dn')delNote(id);
});
function centerSheet(){
  $('#sheetin').innerHTML='<h3>رفع / تحميل ملف</h3><div class="sub" style="margin-bottom:12px">الرفع بيعرض بيانات المكتب بس، والتحميل بيطلّع الملاحظات بس.</div><div style="display:grid;gap:8px"><button class="btn" data-a="upload">'+ic('up')+' رفع ملف القضية (من المكتب)</button><button class="btn em" data-a="dl">'+ic('down')+' تحميل ملف الملاحظات</button><button class="btn sl" data-a="share">'+ic('share')+' مشاركة ملف الملاحظات</button><button class="btn sl" onclick="closeSheet()">إغلاق</button></div>';
  $('#sheet').classList.add('on');
}
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;if(S.tab==='cases')fillCases();else fillClients()}});
document.addEventListener('submit',function(e){
  if(e.target.id==='lockf'){e.preventDefault();
    if($('#pin').value===(localStorage.getItem('law_passcode')||'1234')){try{sessionStorage.setItem('u','1')}catch(x){}$('#lock').classList.add('hidden');$('#app').classList.remove('hidden')}
    else{$('#pin-err').classList.remove('hidden');$('#pin').value=''}}
  if(e.target.id==='passf'){e.preventDefault();
    var o=$('#p-old').value,n=$('#p-new').value,n2=$('#p-new2').value;
    if(o!==(localStorage.getItem('law_passcode')||'1234')){toast('كلمة المرور الحالية غلط');return}
    if(n.length<4){toast('4 أرقام على الأقل');return}if(n!==n2){toast('التأكيد مش مطابق');return}
    localStorage.setItem('law_passcode',n);e.target.reset();toast('اتغيّرت كلمة المرور')}
});
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});
$('#file').addEventListener('change',function(e){onFile(e.target.files[0])});
window.addEventListener('popstate',function(){if(S.stack.length){S.stack.pop();render()}});

paintIcons();$('#lock-ic').innerHTML=ic('scale');
try{if(sessionStorage.getItem('u')==='1'){$('#lock').classList.add('hidden');$('#app').classList.remove('hidden')}}catch(e){}
Promise.all([kvGet('db'),kvGet('notes')]).then(function(r){
  if(r[0]&&r[0].db){S.db=norm(r[0].db);S.meta=r[0].meta||{}}
  if(r[1]){S.notes=r[1].notes||[];S.del=r[1].del||[]}
  render();
});
</script>
</body>
</html>
